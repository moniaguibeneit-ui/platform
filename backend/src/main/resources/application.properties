spring.application.name=platform

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/socialcommerce
spring.datasource.username=postgres
spring.datasource.password=admin

# JPA - Flyway is the source of truth for schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=9090

# JWT (SAD §6.5)
app.jwt.secret=change-me-in-production-this-must-be-at-least-32-characters-long
app.jwt.expiration=PT24H
