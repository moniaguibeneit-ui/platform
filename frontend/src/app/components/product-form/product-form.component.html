<h2 mat-dialog-title>{{ data.mode === 'add' ? 'Add' : 'Edit' }} Perfume</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="product-form">
    <!-- Name -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required>
      <mat-error *ngIf="form.get('name')?.invalid">Name is required</mat-error>
    </mat-form-field>

    <!-- Brand -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Brand</mat-label>
      <input matInput formControlName="brand" required>
      <mat-error *ngIf="form.get('brand')?.invalid">Brand is required</mat-error>
    </mat-form-field>

    <!-- Description -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3" required></textarea>
      <mat-error *ngIf="form.get('description')?.invalid">Description is required</mat-error>
    </mat-form-field>

    <div class="row">
      <!-- Price -->
      <mat-form-field appearance="fill" class="half-width">
        <mat-label>Price</mat-label>
        <input matInput type="number" formControlName="price" required>
        <mat-error *ngIf="form.get('price')?.invalid">Valid price required</mat-error>
      </mat-form-field>

      <!-- Volume -->
      <mat-form-field appearance="fill" class="half-width">
        <mat-label>Volume</mat-label>
        <input matInput formControlName="volume" placeholder="e.g. 100ml" required>
        <mat-error *ngIf="form.get('volume')?.invalid">Volume is required</mat-error>
      </mat-form-field>
    </div>

    <!-- Fragrance Notes -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Fragrance Notes</mat-label>
      <input matInput formControlName="fragranceNotes" placeholder="e.g. Floral, Woody">
    </mat-form-field>

    <!-- Category (hidden or set as Perfume) -->
    <input type="hidden" formControlName="category">

    <!-- In Stock -->
    <mat-checkbox formControlName="inStock" color="primary">In Stock</mat-checkbox>

    <!-- Image Upload -->
    <div class="image-upload">
      <label for="fileInput" class="upload-label">
        <mat-icon>cloud_upload</mat-icon> Choose Image
      </label>
      <input type="file" id="fileInput" (change)="onFileSelected($event)" accept="image/*" style="display:none;">
      <div *ngIf="imagePreview" class="image-preview">
        <img [src]="imagePreview" alt="Preview" width="80" height="80">
        <button type="button" mat-icon-button (click)="removeImage()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>

    <input type="hidden" formControlName="id">
    <input type="hidden" formControlName="imageUrl">
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="!form.valid">
    {{ data.mode === 'add' ? 'Add' : 'Update' }}
  </button>
</mat-dialog-actions>
