<mat-toolbar class="topbar gap-10">

  <!-- Mobile Menu -->
  <button mat-icon-button (click)="toggleMobileNav.emit()" class="d-flex d-md-none justify-content-center">
    <i-tabler name="menu-2" class="icon-20 d-flex"></i-tabler>
  </button>

  <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Notifications">
    <i-tabler class="d-flex" name="bell" matBadge="1" matBadgeColor="primary"></i-tabler>
  </button>
  <mat-menu #menu="matMenu">
    <button mat-menu-item>Welcome to the platform!</button>
  </mat-menu>

  <span class="flex-1-auto"></span>

  <!-- User email badge -->
  <span *ngIf="isAuthenticated" class="user-badge d-none d-md-flex align-items-center gap-8 f-s-14 f-w-500">
    <mat-icon style="font-size:18px;width:18px;height:18px;color:var(--mat-sys-primary);">person</mat-icon>
    {{ userEmail }}
  </span>

  <!-- Profile Dropdown -->
  <button class="rounded-pill" mat-mini-fab [matMenuTriggerFor]="profilemenu" aria-label="Profile">
    <img *ngIf="isAuthenticated" src="/assets/images/profile/user-1.jpg" class="rounded-circle object-cover d-block" width="35" />
    <mat-icon *ngIf="!isAuthenticated">person</mat-icon>
  </button>

  <mat-menu #profilemenu="matMenu" class="cardWithShadow topbar-dd" xPosition="before">
    <!-- User info header -->
    <div *ngIf="isAuthenticated" class="profile-info">
      <div class="profile-avatar">
        <img src="/assets/images/profile/user-1.jpg" class="rounded-circle object-cover" width="40" />
      </div>
      <div>
        <div class="f-w-600 f-s-14">{{ userEmail }}</div>
        <div class="f-s-12 text-muted">Platform User</div>
      </div>
    </div>

    <mat-divider *ngIf="isAuthenticated"></mat-divider>

    <button mat-menu-item *ngIf="isAuthenticated">
      <mat-icon class="d-flex align-items-center"><i-tabler name="user" class="icon-18 d-flex"></i-tabler></mat-icon>
      My Profile
    </button>
    <button mat-menu-item *ngIf="isAuthenticated">
      <mat-icon class="d-flex align-items-center"><i-tabler name="settings" class="icon-18 d-flex"></i-tabler></mat-icon>
      Settings
    </button>

    <div class="p-x-12 m-t-12" *ngIf="isAuthenticated">
      <button mat-stroked-button color="warn" class="w-100" (click)="logout()">
        <mat-icon class="m-r-4">logout</mat-icon> Logout
      </button>
    </div>

    <div class="p-x-12 p-y-12" *ngIf="!isAuthenticated">
      <a [routerLink]="['/authentication/login']" mat-flat-button color="primary" class="w-100">Sign In</a>
    </div>
  </mat-menu>
</mat-toolbar>
