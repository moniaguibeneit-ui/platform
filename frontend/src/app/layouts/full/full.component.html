<mat-sidenav-container class="mainWrapper blue_theme light-theme" autosize autoFocus dir="ltr">
  <!-- ============================================================== -->
  <!-- Vertical Sidebar -->
  <!-- ============================================================== -->
  <mat-sidenav 
    #sidenav 
    [mode]="isOver ? 'over' : 'side'" 
    [opened]="!isOver"
    (openedChange)="onSidenavOpenedChange($event)" 
    (closedStart)="onSidenavClosedStart()" 
    class="sidebarNav">
    
    <div class="flex-layout">
      <app-sidebar (toggleMobileNav)="sidenav.toggle()" [showToggle]="isOver"></app-sidebar>
      <ng-scrollbar class="position-relative" style="height: 100%">
        <mat-nav-list class="sidebar-list">
          @for(item of navItems; track item) {
            <app-nav-item [item]="item" (notify)="isOver ? sidenav.close() : null">
            </app-nav-item>
          }
        </mat-nav-list>
      </ng-scrollbar>
      <div class="p-24"></div>
    </div>
  </mat-sidenav>

  <!-- ============================================================== -->
  <!-- Main Content -->
  <!-- ============================================================== -->
  <mat-sidenav-content class="contentWrapper" #content>
    <main class="pageWrapper maxWidth">
      <!-- Header avec bouton Menu (toujours fonctionnel sur mobile) -->
      <app-header [showToggle]="true" (toggleMobileNav)="sidenav.toggle()"></app-header>

      <div class="body-container">
        <router-outlet></router-outlet>
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
