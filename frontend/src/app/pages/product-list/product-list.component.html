<mat-card class="cardWithShadow">
  <mat-card-content>
    <div class="d-flex align-items-center justify-content-between w-100">
      <mat-card-title>Perfume Collection</mat-card-title>
      <div>
        <button mat-raised-button color="primary" (click)="openAddDialog()">
          <mat-icon>add</mat-icon> Add Perfume
        </button>
        <button mat-icon-button color="inherit" aria-label="More options">
          <mat-icon class="f-s-24 d-flex align-items-center justify-content-center">more_vert</mat-icon>
        </button>
      </div>
    </div>

    <div class="table-responsive">
      <table mat-table [dataSource]="products" class="w-100">
        <!-- Product Image + Name/Brand -->
        <ng-container matColumnDef="product">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-16">Product</th>
          <td mat-cell *matCellDef="let product">
            <div class="d-flex align-items-center">
              <img [src]="product.imageUrl || 'assets/images/placeholder.png'" alt="product" width="50" height="50" class="rounded-circle" />
              <div class="m-l-16">
                <h6 class="text-truncate-2 f-s-14 f-w-600">{{ product.name }}</h6>
                <span class="f-s-14">{{ product.brand }}</span>
              </div>
            </div>
          </td>
        </ng-container>

        <!-- Price -->
        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-16">Price</th>
          <td mat-cell *matCellDef="let product">
            <span class="f-w-600 f-s-14">${{ product.price }}</span>
          </td>
        </ng-container>

        <!-- Volume -->
        <ng-container matColumnDef="volume">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-16">Volume</th>
          <td mat-cell *matCellDef="let product">{{ product.volume }}</td>
        </ng-container>

        <!-- Stock Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-16">Status</th>
          <td mat-cell *matCellDef="let product">
            <span class="bg-light-{{ product.inStock ? 'success' : 'error' }} text-{{ product.inStock ? 'success' : 'error' }} border-{{ product.inStock ? 'success' : 'error' }} rounded f-w-600 p-6 p-y-4 f-s-12">
              {{ product.inStock ? 'In Stock' : 'Out of Stock' }}
            </span>
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-16">Actions</th>
          <td mat-cell *matCellDef="let product">
            <button mat-icon-button color="primary" (click)="viewProduct(product)" matTooltip="View">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button color="accent" (click)="openEditDialog(product)" matTooltip="Edit">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteProduct(product.id!)" matTooltip="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
