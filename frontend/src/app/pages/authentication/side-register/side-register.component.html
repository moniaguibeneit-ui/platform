<div class="blank-layout-container justify-content-center align-items-center bg-light">
  <div class="position-relative row w-100 h-100 bg-gredient justify-content-center">
    <div class="col-lg-4 d-flex align-items-center">
      <mat-card class="cardWithShadow boxed-auth">
        <mat-card-content class="p-32">
          <div class="text-center">
            <a [routerLink]="['/dashboard']">
              <img src="./assets/images/logos/dark-logo.svg" class="align-middle m-2" alt="logo" />
            </a>
          </div>

          <div class="or-border m-t-30">Create your account</div>

          <form class="m-t-30" [formGroup]="form" (ngSubmit)="submit()">
            <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Tenant ID</mat-label>
            <mat-form-field appearance="outline" class="w-100" color="primary">
              <input matInput formControlName="tenantId" placeholder="e.g. 14b8bff1-..." />
              <mat-error *ngIf="f.tenantId.hasError('required')">Tenant ID is required</mat-error>
            </mat-form-field>

            <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Email</mat-label>
            <mat-form-field appearance="outline" class="w-100" color="primary">
              <input matInput formControlName="email" type="email" placeholder="you@acme.com" />
              <mat-error *ngIf="f.email.hasError('required')">Email is required</mat-error>
              <mat-error *ngIf="f.email.hasError('email')">Invalid email</mat-error>
            </mat-form-field>

            <div class="row">
              <div class="col-6">
                <mat-label class="f-s-14 f-w-600 m-b-12 d-block">First Name</mat-label>
                <mat-form-field appearance="outline" class="w-100" color="primary">
                  <input matInput formControlName="firstName" />
                </mat-form-field>
              </div>
              <div class="col-6">
                <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Last Name</mat-label>
                <mat-form-field appearance="outline" class="w-100" color="primary">
                  <input matInput formControlName="lastName" />
                </mat-form-field>
              </div>
            </div>

            <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Password</mat-label>
            <mat-form-field appearance="outline" class="w-100" color="primary">
              <input matInput formControlName="password" type="password" />
              <mat-error *ngIf="f.password.hasError('required')">Password is required</mat-error>
              <mat-error *ngIf="f.password.hasError('minlength')">Min 6 characters</mat-error>
            </mat-form-field>

            <button mat-flat-button color="primary" class="w-100" type="submit" [disabled]="loading">
              {{ loading ? 'Creating...' : 'Sign Up' }}
            </button>
          </form>

          <span class="d-block f-w-500 text-center m-t-24">Already have an Account?
            <a [routerLink]="['/authentication/login']" class="text-decoration-none text-primary f-w-500 f-s-14">
              Sign In
            </a>
          </span>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
