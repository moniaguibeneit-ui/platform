<div class="order-list-container">
  <mat-card class="cardWithShadow">
    <mat-card-header>
      <div>
        <mat-card-title>Orders</mat-card-title>
        <p class="f-s-13 text-muted m-t-4 m-b-0">Manage customer orders and their status</p>
      </div>
      <div class="header-actions">
        <button mat-flat-button color="primary" (click)="openCreate()">
          <mat-icon>add_shopping_cart</mat-icon>
          New Order
        </button>
      </div>
    </mat-card-header>

    <mat-card-content>
      <!-- Loading -->
      <div *ngIf="loading" class="text-center p-y-40">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      <!-- Empty state -->
      <div *ngIf="!loading && orders.length === 0" class="text-center p-y-40">
        <div class="empty-icon-wrap bg-light-primary text-primary m-auto">
          <mat-icon>shopping_cart</mat-icon>
        </div>
        <h4 class="f-w-600 m-t-16 m-b-8">No orders yet</h4>
        <p class="text-muted m-b-24">Create your first order to get started.</p>
        <button mat-flat-button color="primary" (click)="openCreate()">
          <mat-icon>add_shopping_cart</mat-icon>
          New Order
        </button>
      </div>

      <!-- Table -->
      <table *ngIf="!loading && orders.length > 0" mat-table [dataSource]="orders" class="w-100">
        <!-- Order Number -->
        <ng-container matColumnDef="orderNumber">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-16">Order #</th>
          <td mat-cell *matCellDef="let o" class="f-w-600">{{ o.orderNumber }}</td>
        </ng-container>

        <!-- Items count -->
        <ng-container matColumnDef="items">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-16">Items</th>
          <td mat-cell *matCellDef="let o">
            <div class="d-flex align-items-center gap-8">
              <mat-icon style="font-size:18px;width:18px;height:18px;color:var(--mat-sys-primary);">inventory_2</mat-icon>
              {{ itemCount(o) }} items
            </div>
          </td>
        </ng-container>

        <!-- Total -->
        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-16">Total</th>
          <td mat-cell *matCellDef="let o" class="f-w-600 f-s-15">${{ o.totalAmount }}</td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-16">Status</th>
          <td mat-cell *matCellDef="let o">
            <span [class]="statusClass(o.status) + ' rounded f-w-600 p-6 p-y-4 f-s-12'">
              {{ o.status }}
            </span>
          </td>
        </ng-container>

        <!-- Created -->
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-16">Created</th>
          <td mat-cell *matCellDef="let o" class="f-s-13 text-muted">
            {{ o.createdAt | date:'mediumDate' }}
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-16">Actions</th>
          <td mat-cell *matCellDef="let o">
            <button mat-icon-button [matMenuTriggerFor]="statusMenu" matTooltip="Change Status" color="primary">
              <mat-icon>swap_horiz</mat-icon>
            </button>
            <mat-menu #statusMenu="matMenu">
              <button mat-menu-item (click)="updateStatus(o, 'PENDING')" [disabled]="o.status === 'PENDING'">
                <mat-icon>schedule</mat-icon> Pending
              </button>
              <button mat-menu-item (click)="updateStatus(o, 'PAID')" [disabled]="o.status === 'PAID'">
                <mat-icon>payments</mat-icon> Paid
              </button>
              <button mat-menu-item (click)="updateStatus(o, 'SHIPPED')" [disabled]="o.status === 'SHIPPED'">
                <mat-icon>local_shipping</mat-icon> Shipped
              </button>
              <button mat-menu-item (click)="updateStatus(o, 'DELIVERED')" [disabled]="o.status === 'DELIVERED'">
                <mat-icon>check_circle</mat-icon> Delivered
              </button>
              <button mat-menu-item (click)="updateStatus(o, 'CANCELLED')" [disabled]="o.status === 'CANCELLED'">
                <mat-icon>cancel</mat-icon> Cancelled
              </button>
            </mat-menu>
            <button mat-icon-button color="warn" (click)="deleteOrder(o)" matTooltip="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
